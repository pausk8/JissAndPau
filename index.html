<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti ✨</title>
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Contenedor de la lluvia de calaveras */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
            display: none;
        }

        .rain-container.active {
            display: block;
        }

        .falling-skull {
            position: absolute;
            top: -50px;
            font-size: 24px;
            animation: fall linear infinite;
            filter: drop-shadow(0 0 8px #a855f7);
            opacity: 0.7;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.8;
            }
            85% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        .neon-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 600px;
            padding: 40px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .neon-screen {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
            transition: opacity 0.8s ease, transform 0.8s ease;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .neon-screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .neon-glow-purple {
            font-family: 'Pacifico', cursive;
            font-size: 3.8rem;
            color: #f3e8ff;
            line-height: 1.3;
            text-shadow: 
                0 0 5px #a855f7,
                0 0 10px #a855f7,
                0 0 20px #a855f7,
                0 0 40px #9333ea,
                0 0 80px #7e22ce,
                0 0 120px #6b21a8;
            animation: flicker 3s infinite alternate;
        }

        .click-hint {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #7c3aed;
            letter-spacing: 1px;
            font-weight: 300;
        }

        .neon-text-quote {
            font-size: 1.1rem;
            color: #e9d5ff;
            line-height: 1.7;
            font-style: italic;
            padding: 0 15px;
            text-shadow: 
                0 0 4px #c084fc,
                0 0 12px rgba(168, 85, 247, 0.6),
                0 0 25px rgba(147, 51, 234, 0.4);
            margin-bottom: 25px;
        }

        /* Panel interactivo de Neón */
        .interactive-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: 5px;
        }

        .neon-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: rgba(20, 10, 30, 0.6);
            border: 2px solid #7c3aed;
            color: #d8b4fe;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.3);
            -webkit-tap-highlight-color: transparent;
        }

        .tab-btn.active {
            background: #9333ea;
            color: #ffffff;
            border-color: #c084fc;
            box-shadow: 0 0 15px #a855f7, 0 0 30px #7e22ce;
            transform: scale(1.05);
        }

        .interactive-display {
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 15px;
        }

        .secret-message {
            font-size: 1.15rem;
            font-weight: 600;
            color: #fde047; /* Color amarillo inicial por defecto */
            text-shadow: 0 0 12px rgba(250, 204, 21, 0.8);
            animation: fadeIn 0.4s ease;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
                text-shadow: 
                    0 0 5px #a855f7,
                    0 0 10px #a855f7,
                    0 0 20px #a855f7,
                    0 0 40px #9333ea,
                    0 0 80px #7e22ce,
                    0 0 120px #6b21a8;
            }
            20%, 24%, 55% {
                opacity: 0.85;
                text-shadow: none;
            }
        }

        @media (max-width: 480px) {
            .neon-glow-purple { font-size: 3rem; }
            .neon-text-quote { font-size: 0.95rem; }
            .tab-btn { padding: 6px 12px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <!-- Contenedor de la lluvia de calaveras -->
    <div class="rain-container" id="rainContainer"></div>

    <div class="neon-container" id="mainContainer">
        <!-- Pantalla 1: Buenos días hermosa (Tocar cualquier parte para avanzar) -->
        <div class="neon-screen active" id="screen1">
            <h1 class="neon-glow-purple">Buenos días,<br>hermosa</h1>
            <p class="click-hint">(Toca la pantalla para continuar)</p>
        </div>

        <!-- Pantalla 2: Frase principal + Mensaje predeterminado de Mirada -->
        <div class="neon-screen" id="screen2">
            <p class="neon-text-quote">
                "No te puedo hacer entender. No puedo hacer que nadie entienda lo que me está pasando. Ni siquiera puedo explicármelo a mí misma"<br><br>
                <b>Te quiero mucho. PAU</b>
            </p> 

            <!-- Panel de opciones estilo neón -->
            <div class="interactive-panel">
                <div class="neon-tabs">
                    <button class="tab-btn active" id="tabYellow" data-target="yellow">💛💛💛</button>
                    <button class="tab-btn" id="tabPurple" data-target="purple">💜💜💜 Beso</button>
                    <button class="tab-btn" id="tabRed" data-target="red">❤️❤️❤️ Promesa</button>
                </div>

                <div class="interactive-display">
                    <div class="secret-message" id="secretText">
                        “Quisiera descifrar la forma en que miras” 💛
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('mainContainer');
        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const rainContainer = document.getElementById('rainContainer');
        const secretText = document.getElementById('secretText');
        const tabs = document.querySelectorAll('.tab-btn');

        function startSkullRain() {
            rainContainer.classList.add('active');
            
            function createSkull() {
                const skull = document.createElement('div');
                skull.classList.add('falling-skull');
                skull.innerHTML = '💀';
                
                skull.style.left = Math.random() * 100 + 'vw';
                
                // Caída ultra lenta y pocas (1 calavera cada 10 segundos)
                const duration = Math.random() * 10 + 15;
                skull.style.animationDuration = duration + 's';
                
                const size = Math.random() * 15 + 18;
                skull.style.fontSize = size + 'px';

                rainContainer.appendChild(skull);

                setTimeout(() => {
                    skull.remove();
                }, duration * 1000);
            }

            createSkull();
            setInterval(createSkull, 10000);
        }

        // Transición general al tocar la primera pantalla
        function goToScreen2(e) {
            if (screen1.classList.contains('active')) {
                screen1.classList.remove('active');
                screen2.classList.add('active');
                startSkullRain();
            }
        }

        container.addEventListener('click', goToScreen2);
        container.addEventListener('touchend', (e) => {
            // Evita conflictos si se presiona la pantalla
            if (!screen1.classList.contains('active')) return;
            e.preventDefault();
            goToScreen2(e);
        });

        // Control de los botones interactivos inferiores
        tabs.forEach(btn => {
            const handleTabInteraction = (e) => {
                e.stopPropagation();
                e.preventDefault();

                tabs.forEach(t => t.classList.remove('active'));
                btn.classList.add('active');

                const target = btn.getAttribute('data-target');

                if (target === 'yellow') {
                    secretText.style.color = '#fde047';
                    secretText.style.textShadow = '0 0 12px rgba(250, 204, 21, 0.8)';
                    secretText.innerHTML = '“Quisiera descifrar la forma en que miras” 💛';
                } else if (target === 'purple') {
                    secretText.style.color = '#d8b4fe';
                    secretText.style.textShadow = '0 0 12px rgba(216, 180, 254, 0.8)';
                    secretText.innerHTML = '“Quiero comerte la boca” 💜';
                } else if (target === 'red') {
                    secretText.style.color = '#f87171';
                    secretText.style.textShadow = '0 0 12px rgba(248, 113, 113, 0.8)';
                    secretText.innerHTML = '“Quiero quererte siempre” ❤️';
                }
            };

            btn.addEventListener('click', handleTabInteraction);
            btn.addEventListener('touchend', handleTabInteraction);
        });
    </script>
</body>
</html>

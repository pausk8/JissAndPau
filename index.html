<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti ✨</title>
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .neon-container {
            position: relative;
            width: 90%;
            max-width: 600px;
            padding: 40px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .neon-screen {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
            transition: opacity 0.8s ease, transform 0.8s ease;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .neon-screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .neon-glow-purple {
            font-family: 'Pacifico', cursive;
            font-size: 3.8rem;
            color: #f3e8ff;
            line-height: 1.3;
            text-shadow: 
                0 0 5px #a855f7,
                0 0 10px #a855f7,
                0 0 20px #a855f7,
                0 0 40px #9333ea,
                0 0 80px #7e22ce,
                0 0 120px #6b21a8;
            animation: flicker 3s infinite alternate;
        }

        .click-hint {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #7c3aed;
            letter-spacing: 1px;
            font-weight: 300;
        }

        .neon-text-quote {
            font-size: 1.15rem;
            color: #e9d5ff;
            line-height: 1.8;
            font-style: italic;
            padding: 0 15px;
            text-shadow: 
                0 0 4px #c084fc,
                0 0 12px rgba(168, 85, 247, 0.6),
                0 0 25px rgba(147, 51, 234, 0.4);
        }

        .final-heart {
            font-size: 2.5rem;
            margin-top: 25px;
            filter: drop-shadow(0 0 10px #a855f7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
                text-shadow: 
                    0 0 5px #a855f7,
                    0 0 10px #a855f7,
                    0 0 20px #a855f7,
                    0 0 40px #9333ea,
                    0 0 80px #7e22ce,
                    0 0 120px #6b21a8;
            }
            20%, 24%, 55% {
                opacity: 0.85;
                text-shadow: none;
            }
        }

        @media (max-width: 480px) {
            .neon-glow-purple { font-size: 3rem; }
            .neon-text-quote { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="neon-container" id="mainContainer">
        <!-- Pantalla 1: Buenos días hermosa -->
        <div class="neon-screen active" id="screen1">
            <h1 class="neon-glow-purple">Buenos días,<br>hermosa</h1>
            <p class="click-hint">(Toca la pantalla para continuar)</p>
        </div>

        <!-- Pantalla 2: La frase profunda -->
        <div class="neon-screen" id="screen2">
            <p class="neon-text-quote">
                "No te puedo hacer entender. No puedo hacer que nadie entienda lo que me está pasando. Ni siquiera puedo explicármelo a mí misma"<br><br>
                <b>Te quiero mucho. PAU</b>
            </p> 
            <span class="final-heart">💜 💛</span>
        </div>
    </div>

    <script>
        const container = document.getElementById('mainContainer');
        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');

        function handleInteraction(e) {
            e.stopPropagation();
            if (screen1.classList.contains('active')) {
                screen1.classList.remove('active');
                screen2.classList.add('active');
            }
        }

        container.addEventListener('click', handleInteraction);
        container.addEventListener('touchend', (e) => {
            e.preventDefault();
            handleInteraction(e);
        });
    </script>
</body>
</html>
